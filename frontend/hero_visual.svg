<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%" style="background:#0c0b09;" aria-label="Agent safety circuit diagram">
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cce832" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#e3dcc4" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <!-- Background grid dots -->
  <g fill="#1a1814">
    <circle cx="50" cy="50" r="1.2"/><circle cx="150" cy="50" r="1.2"/><circle cx="250" cy="50" r="1.2"/>
    <circle cx="350" cy="50" r="1.2"/><circle cx="450" cy="50" r="1.2"/><circle cx="550" cy="50" r="1.2"/>
    <circle cx="650" cy="50" r="1.2"/><circle cx="750" cy="50" r="1.2"/><circle cx="850" cy="50" r="1.2"/>
    <circle cx="50" cy="150" r="1.2"/><circle cx="150" cy="150" r="1.2"/><circle cx="250" cy="150" r="1.2"/>
    <circle cx="350" cy="150" r="1.2"/><circle cx="450" cy="150" r="1.2"/><circle cx="550" cy="150" r="1.2"/>
    <circle cx="650" cy="150" r="1.2"/><circle cx="750" cy="150" r="1.2"/><circle cx="850" cy="150" r="1.2"/>
    <circle cx="50" cy="250" r="1.2"/><circle cx="150" cy="250" r="1.2"/><circle cx="250" cy="250" r="1.2"/>
    <circle cx="450" cy="250" r="1.2"/><circle cx="550" cy="250" r="1.2"/><circle cx="650" cy="250" r="1.2"/>
    <circle cx="50" cy="350" r="1.2"/><circle cx="250" cy="350" r="1.2"/><circle cx="450" cy="350" r="1.2"/>
    <circle cx="50" cy="450" r="1.2"/><circle cx="250" cy="450" r="1.2"/><circle cx="450" cy="450" r="1.2"/>
    <circle cx="50" cy="550" r="1.2"/><circle cx="250" cy="550" r="1.2"/><circle cx="450" cy="550" r="1.2"/>
  </g>
  <!-- Signal path lines -->
  <line x1="100" y1="180" x2="800" y2="350" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" stroke-opacity=".9"/>
  <line x1="150" y1="280" x2="700" y2="180" stroke="#e3dcc4" stroke-width=".5" stroke-opacity=".25"/>
  <line x1="300" y1="220" x2="600" y2="380" stroke="#cce832" stroke-width=".75" stroke-opacity=".3"/>
  <!-- Nodes -->
  <circle cx="150" cy="220" r="12" fill="#cce832" fill-opacity=".15" stroke="#cce832" stroke-width="1"/>
  <circle cx="150" cy="220" r="4" fill="#cce832"/>
  <text x="150" y="255" text-anchor="middle" fill="#e3dcc4" font-size="9" font-family="IBM Plex Mono,monospace" letter-spacing=".05em">AGENT</text>

  <circle cx="350" cy="260" r="12" fill="#e3dcc4" fill-opacity=".1" stroke="#e3dcc4" stroke-width="1"/>
  <circle cx="350" cy="260" r="4" fill="#e3dcc4"/>
  <text x="350" y="295" text-anchor="middle" fill="#e3dcc4" font-size="9" font-family="IBM Plex Mono,monospace" letter-spacing=".05em">LINEAGE</text>

  <circle cx="520" cy="300" r="12" fill="#cce832" fill-opacity=".15" stroke="#cce832" stroke-width="1"/>
  <circle cx="520" cy="300" r="4" fill="#cce832"/>
  <text x="520" y="335" text-anchor="middle" fill="#e3dcc4" font-size="9" font-family="IBM Plex Mono,monospace" letter-spacing=".05em">REVOCATION</text>

  <circle cx="680" cy="330" r="12" fill="#e3dcc4" fill-opacity=".1" stroke="#e3dcc4" stroke-width="1"/>
  <circle cx="680" cy="330" r="4" fill="#e3dcc4"/>
  <text x="680" y="365" text-anchor="middle" fill="#e3dcc4" font-size="9" font-family="IBM Plex Mono,monospace" letter-spacing=".05em">OTLP / SIGNOZ</text>

  <text x="450" y="620" text-anchor="middle" fill="#777" font-size="11" font-family="IBM Plex Mono,monospace" letter-spacing=".1em">AGENT SAFETY · CLOSED-LOOP DETECTION · REAL-TIME REVOCATION</text>
</svg>