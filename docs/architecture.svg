<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect x="50" y="10" width="700" height="120" rx="8" fill="#e8f4f8" stroke="#333" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-size="16" font-weight="bold">SigNoz (Foundry)</text>
  <rect x="70" y="50" width="180" height="60" rx="4" fill="#fff" stroke="#666"/>
  <text x="160" y="85" text-anchor="middle" font-size="12">OTel Collector</text>
  <rect x="310" y="50" width="180" height="60" rx="4" fill="#fff" stroke="#666"/>
  <text x="400" y="85" text-anchor="middle" font-size="12">MCP Server</text>
  <rect x="550" y="50" width="180" height="60" rx="4" fill="#fff" stroke="#666"/>
  <text x="640" y="85" text-anchor="middle" font-size="12">Alert Webhook</text>

  <line x1="250" y1="80" x2="310" y2="80" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="280" y="75" text-anchor="middle" font-size="10" fill="#666">OTel</text>
  <line x1="550" y1="80" x2="640" y2="80" stroke="#333" stroke-width="2"/>
  <polygon points="640,75 648,80 640,85" fill="#333"/>
  <text x="595" y="65" text-anchor="middle" font-size="10">HMAC POST</text>

  <line x1="640" y1="110" x2="640" y2="160" stroke="#333" stroke-width="2"/>
  <polygon points="635,160 640,170 645,160" fill="#333"/>
  <text x="655" y="140" font-size="10" fill="#666">/alerts</text>

  <rect x="50" y="170" width="700" height="200" rx="8" fill="#f0f8f0" stroke="#333" stroke-width="2"/>
  <text x="400" y="195" text-anchor="middle" font-size="16" font-weight="bold">Sentinel Service</text>

  <rect x="70" y="210" width="150" height="50" rx="4" fill="#c8e6c9" stroke="#388e3c"/>
  <text x="145" y="240" text-anchor="middle" font-size="11">Auth (HMAC-SHA256)</text>
  <rect x="240" y="210" width="150" height="50" rx="4" fill="#c8e6c9" stroke="#388e3c"/>
  <text x="315" y="240" text-anchor="middle" font-size="11">Store (SQLite)</text>
  <rect x="410" y="210" width="150" height="50" rx="4" fill="#c8e6c9" stroke="#388e3c"/>
  <text x="485" y="240" text-anchor="middle" font-size="11">Revoker</text>
  <rect x="580" y="210" width="150" height="50" rx="4" fill="#c8e6c9" stroke="#388e3c"/>
  <text x="655" y="240" text-anchor="middle" font-size="11">Telemetry (OTLP)</text>

  <rect x="200" y="280" width="400" height="70" rx="6" fill="#fff3e0" stroke="#ff9800"/>
  <text x="400" y="305" text-anchor="middle" font-size="13" font-weight="bold">Control Loop</text>
  <text x="400" y="330" text-anchor="middle" font-size="10">Receive → Auth → Parse → Dedupe → Quarantine → Emit OTel → Notify</text>

  <line x1="145" y1="260" x2="315" y2="280" stroke="#666" stroke-width="1"/>
  <line x1="315" y1="260" x2="485" y2="280" stroke="#666" stroke-width="1"/>
  <line x1="485" y1="260" x2="655" y2="280" stroke="#666" stroke-width="1"/>
  <line x1="600" y1="210" x2="400" y2="195" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="530" y="200" font-size="9" fill="#666">spans back to SigNoz</text>

  <rect x="50" y="390" width="700" height="90" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="400" y="415" text-anchor="middle" font-size="16" font-weight="bold">Demo: Runaway Agent</text>
  <text x="400" y="440" text-anchor="middle" font-size="11">5 normal calls → 15 identical failing calls → quarantine at repetition 8</text>
  <text x="400" y="460" text-anchor="middle" font-size="10" fill="#666">CLI: python3 demo/runaway_agent.py --threshold 8</text>
</svg>