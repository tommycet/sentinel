[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sentinel"
version = "0.1.0"
description = "Closed-loop SigNoz-native agent runaway detection and auto-quarantine"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
sentinel = "sentinel.app:main"

[tool.setuptools.packages.find]
where = ["src"]
